name: build-weasel-grid

# 在 GitHub 的 Windows runner 上编译带 vmenu-grid 方向键补丁的小狼毫 0.17.4 x64。
# runner 自带 Windows SDK + ATL，所以不需要本地 VS 环境。
on:
  push:
    branches: [weasel-grid-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 环境信息
        run: |
          cmake --version
          echo "--- SDK ---"
          if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Include") { Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object Name } else { echo "没有 SDK Include" }
          echo "--- ATL ---"
          Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 3 FullName

      - name: 安装 Boost
        # 不用仓库自带的 install_boost.bat：它依赖 aria2c + 7z，runner 上没有 aria2c。
        run: |
          $bv = '1.84.0'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'deps\boost_1_84_0'
          if (-not (Test-Path (Join-Path $dst 'boost\version.hpp'))) {
            New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'deps') | Out-Null
            Invoke-WebRequest "https://archives.boost.io/release/$bv/source/boost_1_84_0.tar.gz" -OutFile boost.tar.gz
            tar -xzf boost.tar.gz -C (Join-Path $env:GITHUB_WORKSPACE 'deps')
            Remove-Item boost.tar.gz -Force
          }
          if (-not (Test-Path (Join-Path $dst 'boost\version.hpp'))) { throw "Boost 没解压成功" }
          echo "Boost OK: $dst"
          echo "BOOST_ROOT=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 编译 librime + Weasel
        run: .\build.bat all

      - name: 看看产出了什么
        if: always()
        run: |
          if (Test-Path output) { Get-ChildItem output -Recurse -Include *.dll,*.exe | Select-Object FullName,Length,LastWriteTime } else { echo "output 目录不存在" }
          if (Test-Path output\archives) { Get-ChildItem output\archives }

      - name: 打包新编译出的 DLL
        if: always()
        run: |
          # 只打包本次构建新产出的 DLL：output 里可能有仓库自带的老文件，不能拿它们去部署
          $cut = (Get-Date).AddMinutes(-90)
          $dlls = @(Get-ChildItem output -Filter *.dll -ErrorAction SilentlyContinue |
                    Where-Object { $_.LastWriteTime -gt $cut })
          Write-Host "新 DLL 数量: $($dlls.Count)"
          $dlls | Select-Object Name, Length, LastWriteTime
          if ($dlls.Count -lt 2) { throw "没有新编译出的 DLL，说明构建没成功，不发布（避免把旧文件当成产物）" }
          $dlls | Copy-Item -Destination . -Force
          Compress-Archive -Path ($dlls.Name) -DestinationPath weasel-grid-dlls.zip -Force
          Get-Item weasel-grid-dlls.zip | Select-Object Name, Length

      - name: 发布到 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weasel-grid-${{ github.run_number }}
          name: weasel-grid build ${{ github.run_number }}
          body: |
            带 vmenu-grid 方向键补丁的小狼毫 0.17.4 x64 DLL（GitHub Actions 编译）。
            补丁：RimeWithWeasel/RimeWithWeasel.cpp 的 ProcessKeyEvent()。
          files: weasel-grid-dlls.zip

      - name: 清理之前失败的 release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete weasel-grid-1 --yes --cleanup-tag 2>$null
          echo "已清理 weasel-grid-1（上一个失败构建留下的空包）"