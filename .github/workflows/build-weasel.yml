name: build-weasel-grid

# 在 GitHub 的 Windows runner 上编译带 vmenu-grid 方向键补丁的小狼毫 0.17.4 x64。
on:
  push:
    branches: [weasel-grid-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 环境信息
        run: |
          echo "--- SDK ---"
          if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Include") { Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object Name } else { echo "没有 SDK Include" }
          echo "--- ATL ---"
          Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 2 FullName

      - name: 安装 Boost
        run: |
          $bv = '1.84.0'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'deps\boost_1_84_0'
          if (-not (Test-Path (Join-Path $dst 'boost\version.hpp'))) {
            New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'deps') | Out-Null
            Invoke-WebRequest "https://archives.boost.io/release/$bv/source/boost_1_84_0.tar.gz" -OutFile boost.tar.gz
            tar -xzf boost.tar.gz -C (Join-Path $env:GITHUB_WORKSPACE 'deps')
            Remove-Item boost.tar.gz -Force
          }
          if (-not (Test-Path (Join-Path $dst 'boost\version.hpp'))) { throw "Boost 没解压成功" }
          echo "BOOST_ROOT=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 编译 librime + Weasel
        run: .\build.bat all

      - name: 全树列出产物（诊断用）
        if: always()
        run: |
          foreach ($d in 'output','lib') {
            if (Test-Path $d) { echo "===== $d ====="; Get-ChildItem $d -Recurse -Include *.dll,*.exe,*.lib -ErrorAction SilentlyContinue | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host }
          }

      - name: 打包新编译出的 weasel DLL
        if: always()
        run: |
          $cut = (Get-Date).AddMinutes(-150)
          # 不限定目录：build.bat 可能把 weasel*.dll 放在 output 的子目录里，
          # 之前只扫 output 顶层，结果错把第三方 7z.dll/WinSparkle.dll 当成了产物。
          $cand = @(Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -ErrorAction SilentlyContinue -Include weasel.dll,weaselx64.dll,weaselarm64.dll |
                    Where-Object { $_.LastWriteTime -gt $cut -and $_.FullName -notmatch '\\test\\' })
          Write-Host "== 新生成的小狼毫 DLL =="
          $cand | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host
          if ($cand.Count -lt 2) { throw "没有编出 weasel*.dll（找到 $($cand.Count) 个），查看上面 output 全树" }
          $names = @()
          foreach ($f in $cand) { Copy-Item $f.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE $f.Name) -Force; $names += $f.Name }
          $names = $names | Sort-Object -Unique
          Compress-Archive -Path $names -DestinationPath weasel-grid-dlls.zip -Force
          Get-Item weasel-grid-dlls.zip | Select-Object Name,Length

      - name: 发布到 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weasel-grid-${{ github.run_number }}
          name: weasel-grid build ${{ github.run_number }}
          body: |
            带 vmenu-grid 方向键补丁的小狼毫 0.17.4 x64 DLL（GitHub Actions 编译）。
            部署方式：停 WeaselServer 后替换安装目录里的同名 DLL。
          files: weasel-grid-dlls.zip