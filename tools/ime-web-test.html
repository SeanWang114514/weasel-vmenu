<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>IME WEB TEST</title>
<style>
  body { font: 16px/1.5 system-ui, "Microsoft YaHei"; margin: 0; padding: 14px; background: #101418; color: #e8eef5; }
  h1 { font-size: 20px; margin: 0 0 10px; color: #7fd1ff; }
  textarea { width: 100%; height: 150px; box-sizing: border-box; font: 22px Consolas, monospace;
             background: #1b2128; color: #fff; border: 2px solid #3a4653; border-radius: 6px; padding: 8px; }
  #mirror { margin-top: 12px; padding: 12px; border-radius: 6px; background: #000;
            color: #6cff6c; font: 26px/1.6 Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .hint { margin-top: 10px; color: #93a4b5; font-size: 14px; }
</style>
</head>
<body>
<h1>IME WEB TEST（网页里验证输入法）</h1>
<textarea id="t" autofocus placeholder="在这里输入……"></textarea>
<div id="mirror">MIRROR: &gt;&gt;&gt;&lt;&lt;&lt; len=0</div>
<div class="hint">镜像区实时显示输入框内容，用于截图验收。测试项：v→2 后按 Backspace 应清空且不上屏；v→2 后按 1 应上屏第一条剪贴板。</div>
<script>
  const t = document.getElementById('t'), m = document.getElementById('mirror');
  function upd() { m.textContent = 'MIRROR: >>>' + t.value + '<<<  len=' + t.value.length; }
  t.addEventListener('input', upd);
  window.addEventListener('load', function () { t.focus(); upd(); });
  update = upd;
</script>
</body>
</html>
